<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Habitante de Calle</title>
  <!-- Splash: CSS inline para verse antes de que cargue el bundle JS -->
  <style>
    html, body { margin: 0; background: #08080b; }
    #splash {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(16px, 4vh, 36px); padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #16161d 0%, #08080b 70%);
      color: #bdb8a8; font-family: monospace;
      opacity: 1; transition: opacity 0.6s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash-logo {
      width: min(70vw, 520px); height: min(42vh, 360px); object-fit: contain;
      opacity: 0; transform: scale(0.97);
      transition: opacity 1s ease, transform 1.4s ease;
    }
    #splash-logo.ready { opacity: 1; transform: none; }
    #splash-bar-wrap { width: min(70vw, 420px); }
    #splash-bar { height: 8px; background: #1b1b22; border: 1px solid #3a3a44; overflow: hidden; }
    #splash-fill { height: 100%; width: 0%; background: #c9a227; }
    #splash-info { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; letter-spacing: 1px; }
    #splash-error { display: none; max-width: min(80vw, 520px); text-align: center; font-size: 13px; color: #e0836f; }
    #splash-error button {
      display: block; margin: 12px auto 0; padding: 6px 18px; cursor: pointer;
      background: #c9a227; color: #08080b; border: 0; font: inherit;
    }
  </style>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
<div id="splash">
  <img id="splash-logo" src="%BASE_URL%logo.png" alt="" onload="this.classList.add('ready')" onerror="this.style.display='none'" />
  <div id="splash-bar-wrap">
    <div id="splash-bar"><div id="splash-fill"></div></div>
    <div id="splash-info"><span id="splash-text">Cargando...</span><span id="splash-pct">0%</span></div>
  </div>
  <div id="splash-error"></div>
</div>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <!-- HUD: barras de stats -->
  <div id="hud">
    <div class="stat-bar" data-stat="hambre">
      <span class="label">🍞</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat-bar" data-stat="sed">
      <span class="label">💧</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat-bar" data-stat="energia">
      <span class="label">😴</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat-bar" data-stat="salud">
      <span class="label">🩹</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat-bar" data-stat="higiene">
      <span class="label">🧼</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat-bar" data-stat="animo">
      <span class="label">🧠</span>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>

  <!-- Topbar -->
  <div id="topbar">
    <span id="clock">Día 1 — 06:00</span>
    <span id="money">$0</span>
    <span id="level-display">Nv 1</span>
    <span id="talent-points">🌟 0</span>
  </div>

  <!-- XP bar -->
  <div id="xp-bar">
    <div id="xp-fill"></div>
  </div>

  <!-- NUEVOS -->
  <div id="boost-indicator">⚡ BOOST ACTIVO</div>
  <div id="interaction-prompt"></div>
  <div id="inventory-panel"></div>
  <div id="save-indicator">💾 Guardado</div>
  <button id="new-game-btn" type="button" tabindex="-1">⟲ Nueva partida</button>
  <div id="disease-panel"></div>

  <!-- Panel de talentos -->
  <div id="talent-panel"></div>

  <!-- Panel de crafteo -->
  <div id="craft-panel"></div>

  <!-- Panel de la tienda del Dealer -->
  <div id="dealer-panel"></div>

  <!-- Controles -->
  <div id="controls-help">
    WASD mover · Shift correr · E interactuar · Q seleccionar/dealer · B pedir limosna · F boost · T talentos · C crafteo · I inventario · 1-5 acceso rápido
  </div>
</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
