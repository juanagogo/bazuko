<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogotá 3D Open-Source (OpenStreetMap + IDECA + Google 3D Tiles) — Bazuko</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: rgba(18, 22, 31, 0.92);
      --border: #2a3245;
      --red: #d9232a;
      --gold: #f2a900;
      --green: #00e676;
      --text: #f4efe6;
      --muted: #9aa5b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
    }
    .sidebar {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 370px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 4px solid var(--red);
      border-radius: 12px;
      padding: 18px;
      backdrop-filter: blur(12px);
      z-index: 10;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 99px;
      background: rgba(217, 35, 42, 0.2);
      color: var(--gold);
      border: 1px solid rgba(242, 169, 0, 0.4);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 19px;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    button, a.btn {
      flex: 1;
      min-width: 105px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a2130;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.15s ease;
    }
    button:hover, a.btn:hover {
      border-color: var(--gold);
      background: #232c40;
    }
    button.primary {
      background: var(--red);
      border-color: #ff4d54;
      color: #fff;
    }
    .landmark-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
    }
    .landmark-card {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .landmark-card:hover {
      border-color: var(--gold);
      transform: translateX(3px);
    }
    .landmark-card strong {
      display: block;
      font-size: 13px;
      color: #fff;
    }
    .landmark-card span {
      font-size: 11.5px;
      color: var(--muted);
    }
    .status-bar {
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(0, 230, 118, 0.09);
      border: 1px solid rgba(0, 230, 118, 0.3);
      font-size: 11.5px;
      color: #b9f6ca;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <aside class="sidebar">
    <span class="badge">OpenStreetMap + IDECA 3D</span>
    <h1>Gemelo Digital 3D de Bogotá</h1>
    <p class="sub">
      Replicación 3D open-source de manzanas, vías, Viaducto del Metro L1 y edificaciones reales de Bogotá extruidas desde polígonos WGS84 (IDECA / OSM).
    </p>
    <div class="btn-row">
      <button id="btn-live-osm" class="primary">Cargar OSM en Vivo</button>
      <a class="btn" href="/">Volver al Juego</a>
    </div>
    <div class="btn-row">
      <button id="btn-focus-centro">Centro / Colpatria</button>
      <button id="btn-focus-metro">Viaducto Metro L1</button>
      <button id="btn-focus-norte">Zona G / Zona T</button>
    </div>
    <div id="status" class="status-bar">
      Motor 3D activo: 8 hitos IDECA + Viaducto Metro L1 + Malla Vial de Bogotá.
    </div>
    <div class="landmark-list" id="landmark-list"></div>
  </aside>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('landmark-list');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.0018);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
    camera.position.set(60, 145, 290);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(160, 12, 165);
    controls.enableDamping = true;
    controls.update();

    scene.add(new THREE.AmbientLight(0xdbe4ff, 0.85));
    const dirLight = new THREE.DirectionalLight(0xfff1d0, 1.45);
    dirLight.position.set(180, 320, 140);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(520, 52, 0x2e3b52, 0x182030);
    grid.position.set(190, 0, 160);
    scene.add(grid);

    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    // Viaducto del Metro de Bogotá L1 sobre Av. Caracas (x = 75)
    const viaductMat = new THREE.MeshStandardMaterial({ color: 0x6c7078, roughness: 0.7 });
    const viaduct = new THREE.Mesh(new THREE.BoxGeometry(8.4, 1.4, 300), viaductMat);
    viaduct.position.set(75, 12.5, 160);
    cityGroup.add(viaduct);

    const trainMat = new THREE.MeshStandardMaterial({ color: 0xd9232a, roughness: 0.3 });
    const trainMesh = new THREE.Mesh(new THREE.BoxGeometry(3.0, 3.3, 46), trainMat);
    trainMesh.position.set(76.9, 14.8, 135);
    cityGroup.add(trainMesh);

    const LANDMARKS = [
      { name: 'Torre Colpatria (Sede GER)', sector: 'Av. Calle 26 con Cra. 7', levels: 50, height: 112, color: 0x3b526b, x: 81, z: 168, w: 24, d: 26 },
      { name: 'Plaza de Toros de Santamaría', sector: 'Parque de la Independencia', levels: 5, height: 16.5, color: 0x9e3d2b, x: 248, z: 164, w: 22, d: 22, round: true },
      { name: 'Planetario de Bogotá', sector: 'Parque de la Independencia', levels: 3, height: 12, color: 0xd8d4cb, x: 232, z: 176, w: 16, d: 16, round: true },
      { name: 'Hotel y Residencias Tequendama', sector: 'Centro Internacional (Cra. 10)', levels: 30, height: 68, color: 0xb8b1a3, x: 146, z: 184, w: 22, d: 18 },
      { name: 'Museo Nacional (El Panóptico)', sector: 'Carrera 7 con Calle 28', levels: 4, height: 14.5, color: 0xa38f78, x: 202, z: 148, w: 32, d: 18 },
      { name: 'Torres del Parque (Salmona)', sector: 'La Macarena', levels: 37, height: 85, color: 0x8f3a29, x: 355, z: 295, w: 22, d: 18 },
      { name: 'Mansión de Los Reyes', sector: 'Zona G / Rosales (Calle 72)', levels: 3, height: 11.5, color: 0x8b3a2b, x: 295, z: 108, w: 18, d: 16 },
      { name: 'Centro Andino y Tarima Zona T', sector: 'Calle 82 / Zona Rosa', levels: 5, height: 19.5, color: 0xd9ccb8, x: 38, z: 62, w: 28, d: 18 }
    ];

    for (const lm of LANDMARKS) {
      const mat = new THREE.MeshStandardMaterial({ color: lm.color, roughness: 0.45, metalness: 0.2 });
      const geo = lm.round
        ? new THREE.CylinderGeometry(lm.w / 2, lm.w / 2, lm.height, 20)
        : new THREE.BoxGeometry(lm.w, lm.height, lm.d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(lm.x, lm.height / 2, lm.z);
      cityGroup.add(mesh);

      const card = document.createElement('div');
      card.className = 'landmark-card';
      card.innerHTML = `<strong>${lm.name}</strong><span>${lm.sector} (${lm.levels} pisos)</span>`;
      card.addEventListener('click', () => {
        controls.target.set(lm.x, lm.height * 0.4, lm.z);
        camera.position.set(lm.x - 45, lm.height + 35, lm.z + 55);
        controls.update();
      });
      listEl.appendChild(card);
    }

    document.getElementById('btn-focus-centro').onclick = () => {
      controls.target.set(160, 20, 168);
      camera.position.set(70, 120, 260);
      controls.update();
    };
    document.getElementById('btn-focus-metro').onclick = () => {
      controls.target.set(75, 14, 135);
      camera.position.set(45, 38, 185);
      controls.update();
    };
    document.getElementById('btn-focus-norte').onclick = () => {
      controls.target.set(165, 12, 85);
      camera.position.set(165, 110, 190);
      controls.update();
    };

    document.getElementById('btn-live-osm').onclick = async () => {
      statusEl.textContent = 'Consultando OpenStreetMap (Overpass API) para el Centro Internacional de Bogotá...';
      try {
        const query = '[out:json][timeout:10];way["building"](4.6115,-74.0725,4.6165,-74.0675);out body 80;>;out skel qt;';
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        const data = await res.json();
        const nodes = new Map();
        for (const el of data.elements ?? []) {
          if (el.type === 'node') {
            const x = 160 + (el.lon - (-74.0700)) * (Math.PI / 180) * Math.cos(4.614 * Math.PI / 180) * 6371000 * 0.45;
            const z = 168 + (4.6140 - el.lat) * (Math.PI / 180) * 6371000 * 0.45;
            nodes.set(el.id, [x, z]);
          }
        }
        let added = 0;
        const osmMat = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.4, transparent: true, opacity: 0.82 });
        for (const el of data.elements ?? []) {
          if (el.type === 'way' && el.tags?.building && el.nodes?.length >= 4) {
            const pts = el.nodes.map(id => nodes.get(id)).filter(Boolean);
            if (pts.length < 3) continue;
            const shape = new THREE.Shape();
            pts.forEach(([px, pz], idx) => idx === 0 ? shape.moveTo(px, -pz) : shape.lineTo(px, -pz));
            const levels = parseFloat(el.tags['building:levels']) || 4;
            const h = Math.min(95, levels * 3.4);
            const geo = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: h, bevelEnabled: false });
            geo.rotateX(-Math.PI / 2);
            cityGroup.add(new THREE.Mesh(geo, osmMat));
            added++;
          }
        }
        statusEl.textContent = `OpenStreetMap en vivo: +${added} edificios reales extruidos sobre el Centro Internacional.`;
      } catch (e) {
        statusEl.textContent = 'Modo offline activo: mostrando las 8 manzanas e hitos IDECA/OSM pre-integrados.';
      }
    };

    function animate(t) {
      requestAnimationFrame(animate);
      trainMesh.position.z = 160 + Math.sin(t * 0.0008) * 110;
      controls.update();
      renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
