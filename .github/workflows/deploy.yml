name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Solo los WAV del juego web; los modelos del port nativo (cpp/modelos) no se publican.
      - name: Audio en Git LFS
        run: git lfs pull --include="public/audio/*"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Compilar para la subcarpeta del repositorio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Comprobar el tamaño de la descarga
        run: |
          size=$(du -sm dist | cut -f1)
          echo "dist pesa ${size} MB"
          if [ "$size" -gt 150 ]; then echo "::error::dist supera 150 MB"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
